<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Helper</title>
<style>
  :root { --bg:#f9f9f9; --card:#fff; --ink:#191919; --muted:#666; --line:#e2e2e2; --accent:#257de0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0b; --card:#191919; --ink:#efefef; --muted:#9c9c9c; --line:#303030; --accent:#338ced; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 12px; }
  .row { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  input, select, textarea { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  input { flex:1; min-width:200px; }
  textarea { width:100%; min-height:140px; font-family:ui-monospace, Consolas, monospace; font-size:13px; }
  button { font:inherit; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 16px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #chat { display:flex; flex-direction:column; gap:10px; margin:12px 0; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .you { border-left:3px solid var(--muted); }
  .bot { border-left:3px solid var(--accent); }
  .who { font-size:12px; color:var(--muted); margin-bottom:4px; }
  small { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>🐍 Python Code Helper</h1>
  <div class="row">
    <input id="token" type="password" placeholder="Paste your Hugging Face token (hf_...)">
    <select id="model">
      <option>Qwen/Qwen2.5-Coder-32B-Instruct</option>
      <option>meta-llama/Llama-3.1-8B-Instruct</option>
    </select>
  </div>
  <small>Your token stays in this browser only (saved locally so you don't have to re-paste).</small>
  <div id="chat"></div>
  <textarea id="q" placeholder="Paste your code or error, or ask a question… (Ctrl+Enter to send)"></textarea>
  <div class="row" style="margin-top:8px">
    <button id="send">Ask</button>
    <button id="clear" style="background:var(--muted)">Clear chat</button>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const SYSTEM = "You are a patient Python tutor for a beginner business-analytics student (pandas, statsmodels, sklearn). " +
  "Explain in simple language. When fixing code, point out each bug, say why it is wrong, then show the corrected line.";
let history = [];

try { $("token").value = localStorage.getItem("hf_token") || ""; } catch {}
$("token").addEventListener("change", () => { try { localStorage.setItem("hf_token", $("token").value.trim()); } catch {} });

function add(who, text) {
  const d = document.createElement("div");
  d.className = "msg " + (who === "You" ? "you" : "bot");
  d.innerHTML = '<div class="who"></div><div class="body"></div>';
  d.querySelector(".who").textContent = who;
  d.querySelector(".body").textContent = text;
  $("chat").appendChild(d);
  d.scrollIntoView({ behavior: "smooth" });
  return d.querySelector(".body");
}

async function ask() {
  const token = $("token").value.trim(), q = $("q").value.trim();
  if (!token) return alert("Paste your Hugging Face token first.");
  if (!q) return;
  add("You", q); $("q").value = "";
  history.push({ role: "user", content: q });
  const out = add("Helper", "Thinking…");
  $("send").disabled = true;
  try {
    const r = await fetch("https://router.huggingface.co/v1/chat/completions", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ model: $("model").value, messages: [{ role: "system", content: SYSTEM }, ...history], max_tokens: 1200 })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error?.message || data.error || r.statusText);
    const a = data.choices[0].message.content;
    out.textContent = a;
    history.push({ role: "assistant", content: a });
  } catch (e) {
    out.textContent = "⚠️ " + e.message;
    history.pop();
  } finally { $("send").disabled = false; }
}

$("send").onclick = ask;
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) ask(); });
$("clear").onclick = () => { history = []; $("chat").innerHTML = ""; };
</script>
</main>
</body>
</html>
